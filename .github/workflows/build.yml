# Builds the launcher from this repository's source. Release binaries come only from this workflow.
# Run it by pushing a tag like v1.9.3, or by hand from the Actions tab with a version number.
name: build

on:
  push:
    tags: ['v*']
    branches: [main]
    paths: ['.github/workflows/**', 'msix/**']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version without the leading v (for example 1.9.3)'
        required: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Version
        id: v
        run: |
          V="${{ github.event.inputs.version }}"
          if [ -z "$V" ] && [ "$GITHUB_REF_TYPE" = "tag" ]; then V="${GITHUB_REF_NAME#v}"; fi
          if [ -z "$V" ]; then V="$(cat msix/VERSION)"; fi   # pushes to main build the version in msix/VERSION
          echo "version=$V" >> "$GITHUB_OUTPUT"
      - name: Build
        env:
          HOST: ${{ vars.KW_HOST }}
          CLIENT_ID: ${{ vars.KW_CLIENT_ID }}
        run: |
          go vet ./...
          sh build.sh "${{ steps.v.outputs.version }}"
          cd dist
          for f in KoreaWarLauncher-*; do cp "$f" "AsiaWar${f#KoreaWar}"; done
          cp AsiaWarLauncher-windows-x64.exe AsiaWarSetup.exe
          cp AsiaWarLauncher-windows-arm64.exe AsiaWarSetup-arm64.exe
          sha256sum * > SHA256SUMS.txt
      - name: Upload Windows binaries (to be signed)
        id: unsigned
        uses: actions/upload-artifact@v4
        with:
          name: windows-unsigned
          path: |
            dist/AsiaWarLauncher-windows-x64.exe
            dist/AsiaWarLauncher-windows-arm64.exe
            dist/AsiaWarSetup.exe
            dist/AsiaWarSetup-arm64.exe
          if-no-files-found: error
      - name: Upload all binaries
        uses: actions/upload-artifact@v4
        with:
          name: all-platforms
          path: dist/
      # Code signing (SignPath Foundation). Enabled once the project is accepted:
      # - uses: signpath/github-action-submit-signing-request@v1
      #   with:
      #     api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
      #     organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
      #     project-slug: cgms-launcher
      #     signing-policy-slug: release-signing
      #     github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
      #     wait-for-completion: true
      #     output-artifact-directory: dist/signed

  # Microsoft Store packages (MSIX). The Store signs them after certification, so they are uploaded unsigned.
  msix:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: windows-unsigned
          path: dist
      - name: Pack MSIX
        shell: pwsh
        env:
          MSIX_IDENTITY_NAME: ${{ vars.MSIX_IDENTITY_NAME }}
          MSIX_PUBLISHER: ${{ vars.MSIX_PUBLISHER }}
          MSIX_PUBLISHER_DISPLAY: ${{ vars.MSIX_PUBLISHER_DISPLAY }}
          MSIX_DISPLAY_NAME: ${{ vars.MSIX_DISPLAY_NAME }}
        run: ./msix/pack.ps1 -Version "${{ needs.build.outputs.version }}" -In dist -Out dist/msix
      - uses: actions/upload-artifact@v4
        with:
          name: store-msix
          path: dist/msix/*.msix
          if-no-files-found: error
